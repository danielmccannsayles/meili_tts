<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MeiLiTTS</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 40px auto;
        max-width: 700px;
        padding: 0 20px;
        line-height: 1.6;
      }

      h1 {
        margin-top: 0;
        font-size: 2em;
      }

      .upload-section,
      .existing-section {
        margin-bottom: 40px;
      }

      button {
        padding: 6px 14px;
        font-size: 1em;
        margin-left: 10px;
        cursor: pointer;
      }

      li {
        margin-bottom: 8px;
      }

      .chunk {
        margin: 8px 0;
        padding: 6px;
        border-radius: 4px;
        cursor: pointer;
      }

      .chunk.active {
        background-color: #d0ebff;
      }

      hr {
        margin: 30px 0;
      }

      .loading {
        color: #888;
        font-style: italic;
      }

      .drop-zone {
        border: 2px dashed #ccc;
        border-radius: 8px;
        padding: 40px 20px;
        text-align: center;
        background-color: #fafafa;
        transition: all 0.3s ease;
        cursor: pointer;
        margin-bottom: 20px;
      }

      .drop-zone.dragover {
        border-color: #007bff;
        background-color: #e7f3ff;
      }

      .drop-zone p {
        margin: 10px 0;
        color: #666;
      }

      .cancel-btn {
        background-color: #dc3545;
        color: white;
        border: none;
        margin-left: 10px;
      }

      .cancel-btn:hover {
        background-color: #c82333;
      }

      .processing-item {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin: 10px 0;
        background-color: #f8f9fa;
      }

      .processing-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .processing-title {
        font-weight: bold;
        margin: 0;
      }

      .processing-status {
        font-size: 0.9em;
        color: #666;
        margin: 5px 0;
      }

      .progress-bar {
        width: 100%;
        height: 20px;
        background-color: #e9ecef;
        border-radius: 10px;
        overflow: hidden;
        margin: 10px 0;
      }

      .progress-fill {
        height: 100%;
        background-color: #007bff;
        transition: width 0.3s ease;
        border-radius: 10px;
      }

      .progress-text {
        text-align: center;
        font-size: 0.8em;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <h1>📖 MeiliTTs Reader</h1>

    <div class="upload-section">
      <h2>Upload a PDF</h2>
      <div id="uploadInterface">
        <div
          class="drop-zone"
          id="dropZone"
          onclick="document.getElementById('pdfInput').click()"
        >
          <p>📄 <strong>Drop your PDF here</strong></p>
          <p>or click to browse files</p>
          <input
            type="file"
            id="pdfInput"
            accept=".pdf"
            style="display: none"
          />
        </div>
        <div style="text-align: center">
          <button type="button" onclick="uploadPDF()">Process</button>
        </div>
      </div>
      <p id="uploadStatus">
        <small
          >Your file will be processed locally using TTS and made interactive.
          Multiple files can be processed simultaneously.</small
        >
      </p>
    </div>

    <div
      class="processing-section"
      id="processingSection"
      style="display: none"
    >
      <hr />
      <h2>Currently Processing</h2>
      <div id="processingList"></div>
    </div>

    <hr />

    <div class="existing-section">
      <h2>Your PDFs</h2>
      <ul id="processedList">
        <li class="loading">Loading...</li>
      </ul>
    </div>

    <script>
      // Track processing jobs
      let processingJobs = new Map();
      let statusPollingInterval = null;
      let dropZone, fileInput;

      // Wait for DOM to be ready
      document.addEventListener("DOMContentLoaded", function () {
        // Get DOM elements
        dropZone = document.getElementById("dropZone");
        fileInput = document.getElementById("pdfInput");

        if (!dropZone || !fileInput) {
          console.error("Required DOM elements not found");
          return;
        }

        // Initialize drag & drop functionality
        initializeDragAndDrop();

        // Load existing data
        loadProcessed();
        // Don't load existing jobs - jobs are session-based only
      });

      function initializeDragAndDrop() {
        dropZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", (e) => {
          e.preventDefault();
          dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
          e.preventDefault();
          dropZone.classList.remove("dragover");

          const files = e.dataTransfer.files;
          if (files.length > 0 && files[0].type === "application/pdf") {
            fileInput.files = files;
            updateDropZoneText(files[0].name);
          } else {
            alert("Please drop a valid PDF file.");
          }
        });

        fileInput.addEventListener("change", (e) => {
          if (e.target.files.length > 0) {
            updateDropZoneText(e.target.files[0].name);
          }
        });
      }

      function updateDropZoneText(filename) {
        dropZone.innerHTML = `
          <p>📄 <strong>${filename}</strong></p>
          <p>Click to choose a different file</p>
        `;
      }

      async function cancelJob(jobId) {
        try {
          const res = await fetch(`/cancel_job/${jobId}`, { method: "POST" });
          if (res.ok) {
            console.log(`Job ${jobId} cancelled`);
          }
        } catch (err) {
          console.error("Failed to cancel job:", err);
        }
      }

      function createProcessingItem(job) {
        const item = document.createElement("div");
        item.className = "processing-item";
        item.id = `job-${job.job_id || "unknown"}`;

        const statusText = getStatusText(job.status);
        const progressPercent = job.progress || 0;

        item.innerHTML = `
          <div class="processing-header">
            <h3 class="processing-title">${job.name} (${job.filename})</h3>
            <button class="cancel-btn" onclick="cancelJob('${
              job.job_id || ""
            }')">Cancel</button>
          </div>
          <div class="processing-status">${statusText}</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progressPercent}%"></div>
          </div>
          <div class="progress-text">${progressPercent}%</div>
        `;

        return item;
      }

      function getStatusText(status) {
        switch (status) {
          case "starting":
            return "Starting...";
          case "processing":
            return "Extracting text...";
          case "generating_audio":
            return "Generating audio...";
          case "writing_files":
            return "Writing files...";
          case "completed":
            return "Completed!";
          case "cancelled":
            return "Cancelled";
          case "error":
            return "Error occurred";
          default:
            return "Processing...";
        }
      }

      function updateProcessingDisplay() {
        const section = document.getElementById("processingSection");
        const list = document.getElementById("processingList");

        if (processingJobs.size === 0) {
          section.style.display = "none";
          return;
        }

        section.style.display = "block";
        list.innerHTML = "";

        for (const [jobId, job] of processingJobs) {
          const item = createProcessingItem({ ...job, job_id: jobId });
          list.appendChild(item);
        }
      }

      async function pollJobStatuses() {
        // Don't poll if we're on reader view
        if (window.location.pathname.includes('/reader.html/')) {
          return;
        }

        const jobIds = Array.from(processingJobs.keys());

        for (const jobId of jobIds) {
          try {
            const res = await fetch(`/job_status/${jobId}`);
            if (res.ok) {
              const jobStatus = await res.json();
              processingJobs.set(jobId, jobStatus);

              // Remove completed/cancelled/error jobs immediately
              if (
                ["completed", "cancelled", "error"].includes(jobStatus.status)
              ) {
                processingJobs.delete(jobId);
                
                // Refresh processed PDFs list when a job completes
                if (jobStatus.status === "completed") {
                  loadProcessed();
                }
              }
            } else {
              // Job not found, remove it
              processingJobs.delete(jobId);
            }
          } catch (err) {
            console.error(`Failed to poll job ${jobId}:`, err);
          }
        }

        updateProcessingDisplay();

        // Stop polling if no active jobs
        if (processingJobs.size === 0 && statusPollingInterval) {
          clearInterval(statusPollingInterval);
          statusPollingInterval = null;
        }
      }

      async function uploadPDF() {
        if (!fileInput) {
          alert("File input not ready. Please try again.");
          return;
        }

        const file = fileInput.files[0];
        if (!file) return alert("Please select a PDF file first.");

        const formData = new FormData();
        formData.append("pdf", file);

        try {
          const res = await fetch("/process", {
            method: "POST",
            body: formData,
            headers: {
              "X-Requested-With": "XMLHttpRequest",
            },
          });

          if (!res.ok) {
            throw new Error("Failed to start processing");
          }

          const data = await res.json();

          // Add job to tracking
          processingJobs.set(data.job_id, {
            name: data.name,
            filename: file.name,
            status: "starting",
            progress: 0,
          });

          // Clear file input and reset drop zone
          fileInput.value = "";
          dropZone.innerHTML = `
            <p>📄 <strong>Drop your PDF here</strong></p>
            <p>or click to browse files</p>
          `;

          // Start polling if not already running
          if (!statusPollingInterval) {
            statusPollingInterval = setInterval(pollJobStatuses, 2000);
          }

          updateProcessingDisplay();
        } catch (err) {
          console.error(err);
          alert("Failed to start processing: " + err.message);
        }
      }

      async function deletePDF(name) {
        if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;

        const res = await fetch(`/delete/${name}`, { method: "DELETE" });
        if (res.ok) {
          loadProcessed(); // Reload list
        } else {
          alert("Failed to delete file.");
        }
      }

      async function deleteIncompleteFile(name) {
        // No confirmation for incomplete files - they're broken anyway
        const res = await fetch(`/delete/${name}`, { method: "DELETE" });
        if (res.ok) {
          loadProcessed(); // Reload list
        } else {
          alert("Failed to delete incomplete file.");
        }
      }

      async function loadProcessed() {
        const res = await fetch("/list_processed");
        const files = await res.json();
        const list = document.getElementById("processedList");
        list.innerHTML = "";

        if (files.length === 0) {
          list.innerHTML = "No PDFS found. Upload and process one";
          return;
        }

        files.forEach((item) => {
          const li = document.createElement("li");

          if (item.complete) {
            // Complete file - show both Open and Delete buttons
            const openBtn = document.createElement("button");
            openBtn.textContent = "Open";
            openBtn.onclick = () => {
              window.location.href = `/reader.html/${item.name}`;
            };

            const delBtn = document.createElement("button");
            delBtn.textContent = "Delete";
            delBtn.style.backgroundColor = "#fdd";
            delBtn.onclick = () => deletePDF(item.name);

            li.textContent = item.name + " ";
            li.appendChild(openBtn);
            li.appendChild(delBtn);
          } else {
            // Incomplete file - show warning and only Delete button
            const warningSpan = document.createElement("span");
            warningSpan.textContent = " ⚠️ (incomplete - processing was interrupted)";
            warningSpan.style.color = "#dc3545";
            warningSpan.style.fontSize = "0.9em";

            const delBtn = document.createElement("button");
            delBtn.textContent = "Delete";
            delBtn.style.backgroundColor = "#dc3545";
            delBtn.style.color = "white";
            delBtn.onclick = () => deleteIncompleteFile(item.name);

            li.textContent = item.name;
            li.appendChild(warningSpan);
            li.appendChild(delBtn);
          }

          list.appendChild(li);
        });
      }

      // Load existing jobs and processed files on page load
      async function loadExistingJobs() {
        try {
          const res = await fetch("/list_jobs");
          if (res.ok) {
            const jobs = await res.json();
            for (const job of jobs) {
              processingJobs.set(job.job_id, job);
            }
            if (processingJobs.size > 0) {
              updateProcessingDisplay();
              if (!statusPollingInterval) {
                statusPollingInterval = setInterval(pollJobStatuses, 1000);
              }
            }
          }
        } catch (err) {
          console.error("Failed to load existing jobs:", err);
        }
      }
    </script>
  </body>
</html>
